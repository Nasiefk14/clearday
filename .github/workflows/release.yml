name: Release

# Reads conventional commits (feat:, fix:) on main and opens a release PR that bumps the version and CHANGELOG.md.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
